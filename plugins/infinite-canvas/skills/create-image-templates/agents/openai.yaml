interface:
  display_name: "制作图像模板"
  short_description: "生成博主风 Soul 模特并构建可验收模板工作流"
  default_prompt: "使用 $infinite-canvas:create-image-templates 读取参考文档，根据模板主题推断甜美、冷酷、御姐、帅气等模特气质与宽泛穿搭风格，让 Soul 生成一张不复制参考图具体服装、姿势和场景的独立 Pinterest 式高颜值博主人物素材；生成付费样片并对照参考图，验收后再生成免费版。"
dependencies:
  tools:
    - type: "mcp"
      value: "infinite-canvas"
      description: "Live Infinite Canvas browser control tools"
policy:
  allow_implicit_invocation: true
