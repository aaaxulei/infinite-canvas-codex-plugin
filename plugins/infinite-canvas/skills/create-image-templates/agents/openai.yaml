interface:
  display_name: "制作图像模板"
  short_description: "生成博主风 Soul 模特并构建可验收模板工作流"
  default_prompt: "使用 $infinite-canvas:create-image-templates 读取参考文档，根据模板主题推断甜美、冷酷、御姐、帅气等适合的模特气质，再让 Soul 生成高颜值、真实 Instagram/TikTok 博主风、生活化手机随拍、正面且脸部清晰的模特图；生成付费样片并对照参考图，验收后再生成免费版。"
dependencies:
  tools:
    - type: "mcp"
      value: "infinite-canvas"
      description: "Live Infinite Canvas browser control tools"
policy:
  allow_implicit_invocation: true
